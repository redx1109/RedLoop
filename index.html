<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0507">
    <title>RedLoop – Free Pipe Loop Puzzle Game | Rotate & Connect</title>
    <meta name="description" content="RedLoop is a free, relaxing loop puzzle game. Rotate tiles to connect every pipe into closed loops. Classic, Time Attack, Zen and Daily modes. Play instantly in your browser.">
    <meta name="keywords" content="loop puzzle, pipe puzzle, infinity loop game, rotate puzzle, free browser game, RedLoop">
    <link rel="canonical" href="https://reddloop.vercel.app/">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23e02d44'%3E%E2%88%9E%3C/text%3E%3C/svg%3E">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RedLoop">
    <meta property="og:title" content="RedLoop – Free Loop Puzzle Game">
    <meta property="og:description" content="Rotate, connect, complete. Four modes, six themes, zero ads.">
    <meta property="og:url" content="https://reddloop.vercel.app/">
    <meta property="og:image" content="https://reddloop.vercel.app/og.png">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"VideoGame","name":"RedLoop","description":"Free loop puzzle game: rotate pipe tiles to form closed loops.","genre":"Puzzle","applicationCategory":"Game","operatingSystem":"Any (browser)","url":"https://reddloop.vercel.app/","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
    </script>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
    <div id="app">
    <section id="screen-home" class="screen active">
        <div class="hero">
        <div class="hero-inf">∞</div>
        <h1 class="hero-title">INFINITY <b>LOOP</b></h1>
        <p class="hero-tag">ROTATE · CONNECT · COMPLETE</p>
        </div>
        <div class="mode-grid">
        <button class="mode-card" data-mode="classic">
            <div class="mode-head"><span class="mode-icon">∞</span><span class="mode-name">CLASSIC</span></div>
            <div class="mode-desc">Endless levels. Densest, longest loops as you advance.</div>
            <div class="mode-best" data-best="classic"></div>
        </button>
        <button class="mode-card" data-mode="time">
            <div class="mode-head"><span class="mode-icon">⏱</span><span class="mode-name">TIME ATTACK</span></div>
            <div class="mode-desc">60 seconds. Each closed loop buys you more time.</div>
            <div class="mode-best" data-best="time"></div>
        </button>
        <button class="mode-card" data-mode="zen">
            <div class="mode-head"><span class="mode-icon">☯</span><span class="mode-name">ZEN</span></div>
            <div class="mode-desc">No timers. No counters. Just the loop.</div>
            <div class="mode-best" data-best="zen"></div>
        </button>
        <button class="mode-card" data-mode="daily">
            <div class="mode-head"><span class="mode-icon">✦</span><span class="mode-name">DAILY</span></div>
            <div class="mode-desc">One shared puzzle. Same for everyone, every day.</div>
            <div class="mode-best" data-best="daily"></div>
        </button>
        </div>
        <div class="home-footer">
        <button class="icon-btn" id="btnSoundQuick" title="Sound">🔊</button>
        <button class="icon-btn" id="btnSettings" title="Settings">⚙</button>
        </div>
    </section>
    <section id="screen-settings" class="screen">
        <div class="settings-header">
        <button class="icon-btn" id="btnSettingsBack" title="Back">←</button>
        <div class="settings-title">SETTINGS</div>
        <div class="settings-header-spacer"></div>
        </div>
        <div class="settings-body">
        <div class="settings-section">
            <div class="settings-section-title">THEME</div>
            <div class="theme-grid" id="themeGrid"></div>
        </div>
        <div class="settings-section">
            <div class="settings-row">
            <div class="settings-row-text"><div class="settings-row-title">Sound</div><div class="settings-row-sub">Music &amp; effects</div></div>
            <button class="toggle" id="toggleSound" aria-label="Sound"><span class="toggle-knob"></span></button>
            </div>
            <div class="settings-row">
            <div class="settings-row-text"><div class="settings-row-title">Reduced motion</div><div class="settings-row-sub">Minimal animation</div></div>
            <button class="toggle" id="toggleMotion" aria-label="Reduced motion"><span class="toggle-knob"></span></button>
            </div>
        </div>
        </div>
    </section>
    <section id="screen-game" class="screen">
        <div class="hud">
        <button class="icon-btn" id="btnBack" title="Back">←</button>
        <div class="hud-center">
            <div class="stat">
            <div class="k" id="statALabel">LEVEL</div>
            <div class="v" id="statA">1</div>
            <div class="diff-dots" id="diffDots"></div>
            </div>
            <div class="stat">
            <div class="k" id="statBLabel">MOVES</div>
            <div class="v" id="statB">0</div>
            </div>
        </div>
        <div class="brand">∞</div>
        </div>
        <div class="board-wrap"><canvas id="c"></canvas></div>
        <div class="toast" id="toast">
        <div class="toast-inner">
            <div class="toast-big" id="toastBig">∞</div>
            <div class="toast-sub" id="toastSub">LOOP CLOSED</div>
        </div>
        </div>
        <div class="overlay" id="overlay">
        <div class="overlay-card">
            <div class="ov-title" id="ovTitle">TIME'S UP</div>
            <div class="ov-score" id="ovScore">0</div>
            <div class="ov-label" id="ovLabel">LOOPS CLOSED</div>
            <div class="ov-best" id="ovBest"></div>
            <div class="overlay-actions">
            <button class="action primary" id="ovPlay">PLAY AGAIN</button>
            <button class="action" id="ovHome">HOME</button>
            </div>
        </div>
        </div>
    </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
